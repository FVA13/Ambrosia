[project]
name = "Ambrosia"
version = "0.4.4"
description = "A Python library for working with A/B tests."
readme = "README.rst"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aslan Bayramkulov", email = "aslan.bayramkulov96@gmail.com" },
    { name = "Artem Khakimov", email = "artem.khakimov@gmail.com" },
    { name = "Artem Vasin", email = "p1not1equals1np@gmail.com" },
]
requires-python = ">=3.8, <3.15"
keywords = [
    "ambrosia",
    "ab testing",
    "split testing",
    "experiment design",
    "groups split",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Core runtime dependencies
dependencies = [
    "jinja2>=3.1.6,<4",
    "joblib>=1.5.2,<2",
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<3",
    "pyyaml>=6.0.3,<7",
    "scipy>=1.16.2,<2",
    "tqdm>=4.67.1,<5",
    "statsmodels>=0.14.5,<0.15",
]

[project.optional-dependencies]
# Optional features exposed as extras
spark = ["pyspark>=3.2"]
knn = ["nmslib>=2.1.1"]
ml = ["scikit-learn>=1.0.2", "catboost>=1.0.4"]
opt = ["hyperopt>=0.2.7"]
all = ["pyspark>=3.2", "nmslib>=2.1.1", "scikit-learn>=1.0.2", "catboost>=1.0.4", "hyperopt>=0.2.7"]

[project.urls]
Homepage = "https://github.com/MobileTeleSystems/Ambrosia"
Repository = "https://github.com/MobileTeleSystems/Ambrosia"
Documentation = "https://ambrosia.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ambrosia"]

# Pixi configuration
[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
ambrosia = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313', 'py314']
include = '\\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | docs
  )/
)
'''

[tool.pytest.ini_options]
console_output_style = "progress"
testpaths = ["tests"]
junit_family = "xunit2"
python_functions = "test_"
markers = [
    "unit: mark a test as a unit test",
    "smoke: mark a test as smoke test"
]
